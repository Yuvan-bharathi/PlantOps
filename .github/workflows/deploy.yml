name: PlantOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - prod
      - master
  workflow_dispatch:

jobs:
  ci-build:
    name: Build & Verify Stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json
            simulator/package.json

      - name: Build Backend
        run: |
          cd backend
          npm ci || npm install
          npm run build

      - name: Build Simulator
        run: |
          cd simulator
          npm ci || npm install
          npm run build

      - name: Build Frontend
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  deploy:
    name: Deploy to AWS EC2
    needs: ci-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Frontend Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Upload Prebuilt Frontend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST || '13.61.62.35' }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'dist/*'
          target: '/home/ubuntu/PlantOps/frontend/dist'
          strip_components: 1
          overwrite: true

      - name: Execute Remote Services Reload on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || '13.61.62.35' }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          script_stop: true
          script: |
            echo "🚀 Starting Automated Deployment on EC2..."
            
            # 1. Update source code
            cd /home/ubuntu/PlantOps
            git fetch origin
            git reset --hard HEAD
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            # 2. Ensure Docker dependencies are running
            sudo docker update --restart unless-stopped plantops-redis plantops-mosquitto 2>/dev/null || true
            sudo docker-compose up -d mosquitto redis
            
            # 3. Build & reload Backend
            cd /home/ubuntu/PlantOps/backend
            npm run build
            pm2 reload plantops-backend --update-env || pm2 start dist/server.js --name "plantops-backend"
            
            # 4. Build & reload Simulator
            cd /home/ubuntu/PlantOps/simulator
            npm run build
            pm2 reload plantops-simulator --update-env || pm2 start dist/index.js --name "plantops-simulator"
            
            # 5. Set Permissions & Reload Nginx
            sudo chmod 755 /home/ubuntu
            sudo chmod -R 755 /home/ubuntu/PlantOps/frontend/dist
            sudo nginx -t && sudo systemctl reload nginx
            
            # 6. Persist PM2 Process List
            pm2 save
            
            echo "✅ Deployment completed successfully! Live at http://${{ secrets.EC2_HOST || '13.61.62.35' }}"
